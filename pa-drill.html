{s:5,t:"Part 919 claims",q:"If the insured's estimate is higher than the carrier's on a partial loss, the carrier must:",o:["Ignore it","Respond promptly in writing and name a contractor who'll do it for its price — or agree to reimburse reasonable excess costs","Deny the claim","Demand appraisal"],a:1,w:"Name a contractor at their price, or pay the reasonable excess.",i:"One of the most useful rules you have: make them name the contractor.",x:"50 IAC 919.80(d)(7)(C)"},
{s:5,t:"Part 919 claims",q:"Section 154.6 unfair claims practices are enforced by:",o:["Private policyholder lawsuits","The Director of Insurance (regulatory)","Class actions","County prosecutors"],a:1,w:"No private right of action; the Director enforces. Acts must be knowing or a general business practice.",i:"For the client's own lawsuit, the tool is Section 155, not 154.6.",x:"215 ILCS 5/154.5–154.6"},
{s:5,t:"Part 919 claims",q:"Which is an unfair claims practice under § 154.6?",o:["Requesting documents","Inspecting before payment","Compelling insureds to sue by offering substantially less than amounts ultimately recovered","Denying a fraudulent claim"],a:2,w:"Also: misrepresenting facts or policy terms, not acknowledging promptly, not settling in good faith when liability is clear.",x:"215 ILCS 5/154.6"},
{s:5,t:"Section 155",q:"Section 155 penalties require the insurer's delay or refusal to be:",o:["Negligent","Vexatious and unreasonable","Fraudulent","Criminal"],a:1,w:"Vexatious and unreasonable — attached to the insured winning the contract claim.",x:"215 ILCS 5/155"},
{s:5,t:"Section 155",q:"The Section 155 penalty is capped at the LESSER of 60% of the amount owed, the excess over the pre-suit offer, or:",o:["$25,000","$50,000","$60,000","$100,000"],a:2,w:"$60,000 — plus reasonable attorney fees and costs.",x:"215 ILCS 5/155",nt:1,fix:1}

// ── SECTION V · ILLINOIS LAW ──
{id:"scope",sec:5,title:"Who is a PA — and who's exempt",min:4,topics:["Scope & exemptions"],b:[
 ['a',"Scope & exemptions"],
 ['p',"Article XLV of the Insurance Code (**215 ILCS 5/1501–1615**) is the Public Adjusters Law. It's 25 sections, enacted 2011, last broadly amended by **P.A. 103-216 (eff. Jan 1, 2024)**."],
 ['p',"A public adjuster is anyone who, **for compensation**, acts for the insured **solely on first-party claims** under policies covering real or personal property (§1510). It covers adjusting those claims, advertising or soliciting as a PA, and advising insureds about them."],
 ['note','trap',"First-party only — the insured's own policy. PAs never handle liability (third-party) claims."],
 ['h',"Five exemptions (§1515(d))"],
 ['ul',["Licensed **attorneys** acting as attorneys","People negotiating **life, health, or annuity** claims","**Technical assistance only** — photographers, estimators, engineers, investigators — who never negotiate","Licensed **health care providers** filing health claim forms","People settling **subrogation between insurers**"]],
 ['note','why',"A contractor who negotiates the claim for the homeowner is NOT exempt. That's unlicensed PA activity — the exact trap the roofing industry walks into."],
 ['p',"Contracts made by an unlicensed person acting as a PA are **void and invalid** (§1515(e)). A business entity needs **its own license** and must designate a licensed individual responsible for compliance (§1515(c), §1525(b))."]
]},
{id:"license",sec:5,title:"Getting and keeping the license",min:5,topics:["Licensing"],b:[
 ['a',"Licensing"],
 ['tbl',[["Requirement","Detail"],["Minimum age","18 (§1525)"],["Bond / letter of credit","$50,000 (§1560)"],["License fee — resident","$250 / 2 yrs, via NIPR"],["License fee — nonresident","$500 / 2 yrs"],["Business entity","$250 / 2 yrs"],["Exam fee","$92 (incl. $50 state fee)"],["Continuing ed","24 hrs / 2 yrs incl. 3 ethics (§1565)"],["Fingerprints","Required — ISP + FBI before licensing"],["Lapsed license","Reinstate within 12 months at double the unpaid fee (§1545)"]]],
 ['note','unv',"Nonresident fee, entity fee, and the reinstatement penalty come from the Feb guide and haven't been confirmed against statute text yet."],
 ['h',"Nonresidents and moving here"],
 ['p',"A nonresident gets an Illinois license if they hold a resident PA license in good standing at home and their state reciprocates (§1540). If the home license ends, **the Illinois license ends immediately**. Address changes go to the Director within **30 days**."],
 ['p',"A PA licensed in another state for **12 months** in good standing may skip the exam (§1535). Someone moving to Illinois applies within **90 days** of residency."],
 ['h',"The licensing path, in order"],
 ['ul',["Pass the exam ($92)","Wait **5 days**, then apply","Fingerprint (Illinois-approved live scan)","Get the **$50,000** bond or letter of credit","File your **contract form** with IDOI","Apply through **NIPR** with the $250 fee — upload bond and contract or it's rejected","**Don't sign any client** until the license is issued AND the contract is approved — two separate approvals"]],
 ['note','why',"For All Dire, this is your launch checklist. The two-approval rule is tested and it's also the mistake that voids your first contract."],
 ['p',"Records of every transaction are kept **at least 7 years** after it ends, open to the Director anytime (§1585)."]
]},
{id:"fees",sec:5,title:"Fees and the 10% cap",min:4,topics:["Fees"],b:[
 ['a',"Fees"],
 ['p',"The 2024 amendments rebuilt PA pay rules. Heavily tested."],
 ['ul',["**Personal residence:** no more than **10%** of the insurer's settlement payment on any claim — always (§1570(e))","**Other property:** **10%** when the loss is from a catastrophic event, unless the Director approves more in writing (§1570(d))","Fee can't include the **deductible** — only net claim payments count (Rule 3118.90(c))","No commissions to unlicensed people who need a license; unlicensed people can't take adjusting fees (§1570(a),(b))"]],
 ['p',"'Personal residence' means property under a fire and extended coverage policy: a **1–4 family dwelling** and the household contents in it."],
 ['note','upd',"Bulletin 2024-16: on personal residence claims you can't add travel, lodging, meals, or expert fees on top of the 10%. Only policy-covered costs like emergency mitigation can be reimbursed outside the cap. Experts you hire are paid by YOU."],
 ['note','unv',"The Feb guide also says a catastrophe declaration lasts 90 days, renews in 30-day steps county by county, and the Director answers exception requests in 5 business days. Not yet confirmed against statute text."],
 ['h',"When you get no percentage at all"],
 ['p',"If the insurer pays or commits in writing to pay the **policy limit within 5 business days** after the loss is reported, the PA gets **no commission — only reasonable compensation for services provided** (§1575(c))."],
 ['note','why',"That's the law stopping a PA from taking 10% of money the carrier was already handing over."]
]},
{id:"contract",sec:5,title:"The PA contract",min:6,topics:["Contracts"],b:[
 ['a',"Contracts"],
 ['p',"Every contract is written and filed with **IDOI for approval before use**. Rule 3118.80: at least **10-point font**, form number and edition in the **lower left corner**."],
 ['h',"Must include (§1575(a))"],
 ['ul',["PA's legal name, home-state address, email, phone","License number(s)","Title: **\"Public Adjuster Contract\"**","Insured's name, address, insurer, policy number","Description of the loss and its location","Description of services","Both signatures, with date and time of each","Attestation that the PA is fully bonded","Full compensation, including any 10% cap"]],
 ['h',"The cancel window (§1575(j))"],
 ['p',"The insured can void the contract within **5 business days after the insurance company receives it**. The PA must email the insurer an exact copy within **5 business days** of signing. Cancellation can come by **certified/registered mail, personal service, or email**. If cancelled, the PA returns anything of value within **15 business days**."],
 ['note','upd',"Before 2024 the window ran from signing. Now it runs from when the carrier receives the contract — old guides get this wrong."],
 ['note','why',"Your email to the carrier starts the client's clock. Send it the same day and keep proof."],
 ['h',"Prohibited terms (§1575(e), Rule 3118.90)"],
 ['ul',["Fees on money due but not yet paid, or the **whole fee from the first check**","Requiring checks issued **only in the PA's name**","Blocking the insured's **civil remedies**","**Hold-harmless** for the PA's own negligence","**Power of attorney** to act in place of the insured","A **higher fee** if the client skips your preferred contractor","**Requiring** your preferred contractor","A fee that **includes the deductible**"]],
 ['note','trap',"Naming the PA as co-payee is ALLOWED (with the exact percentage stated). Power of attorney is NOT."],
 ['h',"The pre-signing disclosure (§1575(f))"],
 ['p',"Before signing, the insured gets a separate signed disclosure explaining the **three kinds of adjusters — company, independent, public** — and stating: hiring a PA is not required; the PA doesn't represent the insurer or IDOI; the fee is the insured's to pay."]
]},
{id:"conduct",sec:5,title:"Conduct rules and contractors",min:5,topics:["Conduct","Contractors"],b:[
 ['a',"Conduct"],
 ['p',"The fiduciary standard, word for word: **\"objectivity and complete loyalty to the interests of the client alone\"** (§1590(a))."],
 ['h',"Solicitation"],
 ['ul',["No soliciting **7:00 p.m. – 8:00 a.m.**","No soliciting while the **fire department is on scene** or the loss is still happening"]],
 ['note','trap',"Signing a contract you already arranged at 7:30 p.m. is fine. Knocking on the neighbor's door at 7:15 p.m. is not — that's soliciting."],
 ['h',"Other prohibitions"],
 ['ul',["No settling without the insured's **knowledge and consent**","No **legal advice**","No unlicensed employees doing PA work","No **advancing money** to the insured, except for emergency services","No salvage interest without the insured's **written OK after settlement**","Don't take claims **beyond your expertise**"]],
 ['a',"Contractors"],
 ['h',"Contractors and referrals"],
 ['note','upd',"REPEALED April 30, 2024: the 'present two competitive bids' rule and the 'PA warrants the contractor's workmanship' rule. Your Feb guide still teaches both. Don't pick them on the exam."],
 ['p',"Current rule (Rule 3118.90): before recommending a contractor, confirm it has **liability insurance, a performance bond, required licenses, and a written workmanship warranty** — and document that in your records."],
 ['p',"Disclose in writing, before signing, any **direct or indirect financial interest** in anyone involved in the claim — ownership, investments, shared employees, referral fees, family interests. The relationship is legal; hiding it isn't."],
 ['h',"Client money"],
 ['p',"Funds held for the insured go into a separate **escrow or trust account at an FDIC-insured institution** (§1580). Mixing them with your money is **commingling**. Taking them is a **Class 4 felony**."],
 ['note','unv',"The Feb guide adds: non-interest-bearing, in your home state or where the loss happened. Not yet confirmed against statute text."]
]},
{id:"penalties",sec:5,title:"Penalties and discipline",min:3,topics:["Penalties"],b:[
 ['a',"Penalties"],
 ['p',"The Director can deny, suspend, revoke, or refuse to renew for many listed grounds: misstatements, misappropriation, dishonesty convictions, fraud, cheating on the exam, bad records, conduct violations (§1555)."],
 ['tbl',[["Item","Rule"],["Civil penalty","Up to $10,000 per cause, $100,000 total"],["After revocation","Can't reapply for 5 years"],["Unlicensed PA work","Class A misdemeanor (§1610)"],["Taking client money","Class 4 felony (§1610)"],["Action in another state","Report within 30 days of final disposition (§1595)"]]],
 ['note','unv',"Penalty amounts, the 5-year wait, and the 30-day reporting rule are from the Feb guide — not yet confirmed against statute text. The two criminal classes are confirmed."]
]},
{id:"carrier",sec:5,title:"Carrier rules: Part 919 and §155",min:6,topics:["Part 919 claims","Section 155"],b:[
 ['a',"Part 919 claims"],
 ['p',"You represent the insured, but the exam tests what carriers must do — because that's how you spot violations."],
 ['h',"Unfair claims practices (§154.6)"],
 ['ul',["Misrepresenting facts or policy terms","Not acknowledging communications promptly","No reasonable standards for investigation","Not settling in good faith when liability is clear","Forcing suits by lowballing","Refusing to pay without a reasonable investigation"]],
 ['note','trap',"§154.6 has NO private right of action. The Director enforces it, and the acts must be knowing or a general business practice. The client's own lawsuit tool is §155."],
 ['h',"The clocks (50 IAC 919)"],
 ['tbl',[["Clock","Rule"],["15 working days","Respond to communications"],["21 working days","Contact all parties after notice of loss (liability clear)"],["30 days","Offer payment after affirming liability; pay undisputed amounts"],["30 days","Written explanation of a denial/lower settlement after investigation"],["40 calendar days","Median payment benchmark (fire/EC)"],["75 days or 25 after proof of loss","Written delay explanation — whichever is LESS"]]],
 ['note','why',"File proof of loss early — it can start the 25-day clock before the 75-day one."],
 ['p',"Carriers must include the **Notice of Availability of the Department of Insurance** with denials and delay letters, and give the **depreciation worksheet** on request (age, condition, life expectancy). ACV = **replacement cost at time of loss minus depreciation** (919.80(d)(8))."],
 ['p',"If your estimate is higher, the carrier must respond in writing and **name a contractor who'll do it for their price** — or agree to pay reasonable excess costs (919.80(d)(7)(C))."],
 ['note','why',"This is one of your strongest claims tools. Make them name the contractor."],
 ['p',"Carriers can't mark a check 'final' or a 'release' unless limits are paid or there's a real dispute, can't demand proof of loss faster than the policy allows, and can't require a **polygraph** (an EUO is fine if the policy allows it)."],
 ['note','unv',"The check, proof-of-loss, and polygraph rules are from the Feb guide — not yet confirmed against the rule text."],
 ['a',"Section 155"],
 ['h',"Section 155 — bad faith penalties"],
 ['p',"If the carrier's conduct was **vexatious and unreasonable**, the court can add attorney fees plus the **lesser of: 60% of what's owed, $60,000, or the excess over the pre-suit offer**. It's a remedy attached to winning the contract claim, not a standalone lawsuit."]
]},
// ── SECTION II · TERMS & CONCEPTS ──
{id:"principles",sec:2,title:"Core principles",min:6,topics:["Indemnity","Insurable interest","Good faith","Subrogation","Waiver & estoppel","Causation","Hazards","Terms"],b:[
 ['a',"Indemnity"],
 ['h',"Indemnity"],
 ['p',"Insurance puts the insured back where they were — **no better, no worse**. The insurer pays the **lesser of the loss or the limit**. Exceptions: **replacement cost** coverage and **valued policies**."],
 ['a',"Insurable interest"],
 ['h',"Insurable interest"],
 ['p',"A financial stake in the property. For property, it must exist **at the time of loss** (life insurance: at inception). Sources: ownership, secured creditor (mortgagee), lease, contract rights, legal liability."],
 ['a',"Good faith"],
 ['h',"Utmost good faith"],
 ['ul',["**Representations:** substantially true","**Warranties:** literally true (mostly marine)","**Concealment** of a material fact can void coverage"]],
 ['p',"In Illinois, a misstatement voids coverage only if made **with intent to deceive** or it **materially affected** the risk (215 ILCS 5/154)."],
 ['a',"Subrogation"],
 ['h',"Subrogation"],
 ['p',"After paying, the insurer **steps into the insured's shoes** to collect from whoever caused the loss. The insured can't impair that right — like signing a release with the at-fault party."],
 ['note','why',"'Sub' (under) + 'rogare' (to ask): the insurer asks in the insured's place."],
 ['a',"Waiver & estoppel"],
 ['h',"Waiver and estoppel"],
 ['p',"**Waiver** = voluntarily giving up a known right. **Estoppel** = a court bars a party from contradicting earlier conduct someone relied on. Reservation-of-rights letters and non-waiver agreements exist to prevent accidental waiver."],
 ['note','why',"Adjuster said 'go ahead and tear off,' then denied? That's reliance — an estoppel argument."],
 ['a',"Causation"],
 ['h',"Proximate cause"],
 ['p',"The unbroken chain of events from a peril to the loss. **Direct loss** is the peril's physical damage; **indirect loss** follows from it (interior water after wind opens the roof, living expenses)."],
 ['a',"Hazards"],
 ['h',"Hazards"],
 ['p',"**Peril** causes the loss. **Hazard** makes it likelier. **Moral** hazard = dishonesty (morals). **Morale** hazard = carelessness because you're insured (attitude)."],
 ['a',"Terms"],
 ['h',"Quick terms"],
 ['ul',["**Binder:** temporary proof of coverage","**Bailment:** your property in someone else's care (repair shop)","**Salvage:** damaged property the insurer takes after paying","**Limit of liability:** per occurrence, aggregate, or per item"]]
]},
{id:"math",sec:2,title:"The money math",min:5,topics:["Valuation","Coinsurance","Deductibles","Other insurance"],b:[
 ['a',"Valuation"],
 ['h',"ACV vs RCV"],
 ['p',"**ACV = Replacement Cost − Depreciation.** RCV pays full replacement with like kind and quality. Under RCV the insured usually gets **ACV first**, then **recoverable depreciation** after repairs."],
 ['p',"Example: RC $280,000, ACV $200,000 → depreciation **$80,000**."],
 ['a',"Coinsurance"],
 ['h',"Coinsurance — 'Did over Should times Loss'"],
 ['p',"**Payment = (Carried ÷ Required) × Loss.** Required = value × coinsurance %."],
 ['p',"Example: $1,000,000 building, 80%, carries $500,000, loss $200,000. Required $800,000. $500K ÷ $800K × $200K = **$125,000**. The insured eats $75,000."],
 ['note','trap',"If carried ≥ required, there's no penalty — check that before doing any math."],
 ['a',"Deductibles"],
 ['h',"Deductibles"],
 ['ul',["**Flat:** fixed dollars","**Percentage:** on the insured **value**, not the loss — 2% of a $300,000 dwelling = $6,000","**Franchise:** below the threshold nothing; above it, the **whole** loss"]],
 ['a',"Other insurance"],
 ['h',"Two policies, one loss"],
 ['p',"**Pro rata:** (this policy's limit ÷ all limits) × loss. $100K + $300K policies, $80K loss → the $100K policy pays **$20,000**. **Equal shares:** split evenly until the smallest limit runs out."]
]},
// ── SECTION I + III · PRODUCTS & POLICY PROVISIONS ──
{id:"forms",sec:1,title:"Homeowners forms and perils",min:6,topics:["HO forms","HO limits","HO conditions","Water & mold","Contract law"],b:[
 ['a',"HO forms"],
 ['h',"Named vs open perils — the burden flip"],
 ['p',"**Named perils:** only listed perils covered; the **insured proves** a listed peril caused it. **Open perils:** everything unless excluded; the **insurer proves** the exclusion."],
 ['note','why',"Open perils is your best weapon: make the carrier name the exclusion and prove it applies."],
 ['tbl',[["Form","Coverage"],["HO-2 Broad","Named perils (16)"],["HO-3 Special","Dwelling OPEN · contents NAMED"],["HO-4 Renters","Contents only, named"],["HO-5 Comprehensive","Open on dwelling AND contents"],["HO-6 Condo","Walls-in + contents"],["HO-7 Mobile home","Like HO-3 for manufactured homes"],["HO-8 Older home","ACV/repair basis, limited perils"]]],
 ['note','trap',"HO-3 mystery ceiling stain: the dwelling is open perils, so the insurer must prove an exclusion. Can't prove it? Covered."],
 ['a',"HO limits"],
 ['note','add',"Not in your Feb guide — standard ISO HO-3 limits the exam pulls from."],
 ['tbl',[["Coverage","Default"],["B Other structures","10% of A"],["C Personal property","50% of A"],["D Loss of use","30% of A"],["Contents off premises","10% of C (min $1,000)"],["Trees/shrubs","5% of A, $500 per tree, no wind"],["Money","$200"],["Jewelry/furs theft","$1,500"],["Firearms / silverware theft","$2,500"],["Fire dept charge","$500"],["Debris removal","Extra 5% of the limit"]]],
 ['a',"HO conditions"],
 ['p',"**Vacant** = no people and no contents. **Unoccupied** = furnished, nobody living there. Vacant **60+ consecutive days** → vandalism and glass coverage drop."],
 ['a',"Water & mold"],
 ['p',"A **burst pipe** is sudden and accidental discharge — covered. 'Flood' means outside surface water — excluded. Interior **wind-driven rain** is covered only if wind first made an opening."],
 ['a',"Contract law"],
 ['h',"Contract law (Section III)"],
 ['ul',["Valid contract: **agreement, consideration, competent parties, legal purpose**","**Adhesion:** the insurer wrote it, so ambiguity is read against the insurer","**Aleatory:** unequal exchange based on chance ('alea' = dice)","Policy parts — **DICE:** Declarations, Insuring agreement, Conditions, Exclusions"]]
]},
{id:"conditions",sec:3,title:"Policy conditions, SFP and flood",min:5,topics:["Provisions","Standard Fire Policy","NFIP"],b:[
 ['a',"Provisions"],
 ['ul',["**Abandonment:** never allowed — the insurer chooses to repair, rebuild, or pay","**Pair and set:** pays the lost piece or drop in value, not the whole set","**Appraisal:** settles the **amount** only, never coverage. Two appraisers pick an umpire; any two agree = binding. Each side pays its appraiser; umpire split","**Mortgage clause:** lender protected even if the owner breaks the policy; gets its own cancellation notice","**Liberalization:** free coverage improvements apply to existing policies automatically","**Assignment:** not before a loss without consent; claim proceeds after a loss, yes"]],
 ['h',"Duties after loss"],

// ════════ Setup ════════
const EXAM={1:.35,2:.25,3:.05,4:.10,5:.25};
const SECNAME={0:"Start here",1:"I · Property products — 35%",2:"II · Terms & concepts — 25%",3:"III · Policy provisions — 5%",4:"IV · Building & estimating — 10%",5:"V · Illinois law — 25%"};
const SECSHORT={1:"I PROD",2:"II TERMS",3:"III CONTR",4:"IV BLDG",5:"V IL LAW"};
const SECORDER=[0,5,2,1,3,4];
const BATCH=6,LOCK_MS=1000,RUSH_MS=3000,KEY='pa-drill-v5';
const RUSH_TXT='Rushed — you answered in under 3 seconds.';
const hasClaudeStore=!!(window.storage&&typeof window.storage.get==='function');
const $=id=>document.getElementById(id);
const el={qCat:$('qCat'),qSeen:$('qSeen'),qText:$('qText'),opts:$('opts'),exp:$('exp'),card:$('card'),nextBtn:$('nextBtn'),
  today:$('sToday'),acc:$('sAcc'),weak:$('sWeak'),rush:$('sRush'),streak:$('streak'),reset:$('resetBtn'),
  vStudy:$('vStudy'),vDrill:$('vDrill'),chHome:$('chHome'),chRead:$('chRead'),reader:$('reader'),rPane:$('rPane'),rTitle:$('rTitle'),chChip:$('chChip')};

function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36);}
Q.forEach(q=>{q.id=hash(q.q);});
const secCount={};Q.forEach(q=>{secCount[q.s]=(secCount[q.s]||0)+1;});
const T2CH={};CH.forEach(c=>c.topics.forEach(t=>{T2CH[t]=c.id;}));
const CHBY={};CH.forEach(c=>{CHBY[c.id]=c;});
const chQs=id=>{const c=CHBY[id];return Q.map((q,i)=>i).filter(i=>c.topics.includes(Q[i].t));};

let S=fresh();
let view='study',openCh=null,filter='all',cur=-1,answered=false,teaching=false,recent=[],unlockAt=0,lockTimer;

function fresh(){return {q:{},today:{d:dkey(),n:0,c:0},streak:0,read:{},pos:{},last:null,view:'study'};}
function dkey(){const x=new Date();return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');}
function stat(i){return S.q[Q[i].id]||{c:0,w:0,s:0,f:0,t:0};}
const seen=t=>t.c+t.w, isWeak=t=>t.w>0&&t.s<2, mastered=t=>t.s>=2;

async function load(){
  try{
    let raw=null;
    if(hasClaudeStore){const r=await window.storage.get(KEY);raw=r&&r.value;}
    if(!raw)raw=localStorage.getItem(KEY);
    if(raw){const p=JSON.parse(raw);const f=fresh();S={...f,...p,today:{...f.today,...(p.today||{})},q:p.q||{},read:p.read||{},pos:p.pos||{}};}
  }catch(e){}
  if(S.today.d!==dkey())S.today={d:dkey(),n:0,c:0};
  $('bankN').textContent=Q.length;
  renderHome();renderStats();next();
  show(S.view==='drill'?'drill':'study');
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    const json=JSON.stringify(S);
    try{localStorage.setItem(KEY,json);}catch(e){}
    try{if(hasClaudeStore)await window.storage.set(KEY,json);}catch(e){}
  },200);
}

// ════════ Tabs ════════
function show(v){
  view=v;S.view=v;save();
  el.vStudy.hidden=v!=='study';el.vDrill.hidden=v!=='drill';
  for(const t of $('tabs').children)t.classList.toggle('on',t.dataset.v===v);
  if(v==='drill')requestAnimationFrame(fit);
}
$('tabs').addEventListener('click',e=>{const t=e.target.closest('.tab');if(t)show(t.dataset.v);});

// ════════ Study ════════
function inline(parent,text){            // **bold** → <strong>, everything else as plain text
  text.split('**').forEach((part,i)=>{
    if(!part)return;
    if(i%2){const s=document.createElement('strong');s.textContent=part;parent.append(s);}else parent.append(part);
  });
}
const NOTE={why:"Now why is that important?",upd:"Updated — the rule changed",trap:"Exam trap",add:"Added — not in your Feb guide",unv:"Not yet confirmed"};
function chProgress(id){const qs=chQs(id);return {n:qs.length,m:qs.filter(i=>mastered(stat(i))).length};}

function renderHome(){
  const h=el.chHome;h.replaceChildren();
  const last=S.last&&CHBY[S.last];
  const nextUnread=CH.find(c=>!S.read[c.id]);
  const target=last&&!S.read[last.id]?last:(nextUnread||last||CH[0]);
  const b=document.createElement('button');b.className='cont';
  const sm=document.createElement('small');sm.textContent=(last&&target===last)?'Pick up where you left off':'Next up';
  const sp=document.createElement('span');sp.textContent=target.title;
  b.append(sm,sp);b.onclick=()=>openChapter(target.id);h.append(b);
  for(const sec of SECORDER){
    const list=CH.filter(c=>c.sec===sec);if(!list.length)continue;
    const g=document.createElement('div');g.className='grp';g.textContent=SECNAME[sec];h.append(g);
    for(const c of list){
      const r=document.createElement('button');r.className='row'+(S.read[c.id]?' read':'');
      const k=document.createElement('span');k.className='chk';k.textContent=S.read[c.id]?'✓':'';
      const tt=document.createElement('span');tt.className='tt';
      const bb=document.createElement('b');bb.textContent=c.title;
      const pr=chProgress(c.id);
      const s2=document.createElement('span');s2.textContent=c.min+' min read'+(pr.n?' · '+pr.m+'/'+pr.n+' questions mastered':'');
      tt.append(bb,s2);
      if(pr.n){const bar=document.createElement('div');bar.className='bar';const i=document.createElement('i');i.style.width=Math.round(100*pr.m/pr.n)+'%';bar.append(i);tt.append(bar);}
      r.append(k,tt);r.onclick=()=>openChapter(c.id);h.append(r);
    }
  }
}
function renderChapter(c){
  const a=el.reader;a.replaceChildren();
  const h=document.createElement('h2');h.textContent=c.title;a.append(h);
  let anchorEl=null;
  for(const blk of c.b){
    const [k,x,y]=blk;let n;
    if(k==='a'){anchorEl=document.createElement('div');anchorEl.className='anchor';anchorEl.dataset.topic=x;a.append(anchorEl);continue;}
    if(k==='h'){n=document.createElement('h3');n.textContent=x;}
    else if(k==='p'){n=document.createElement('p');inline(n,x);}
    else if(k==='ul'){n=document.createElement('ul');for(const it of x){const li=document.createElement('li');inline(li,it);n.append(li);}}
    else if(k==='tbl'){n=document.createElement('div');n.className='tblw';const t=document.createElement('table');
      x.forEach((row,ri)=>{const tr=document.createElement('tr');row.forEach(cell=>{const td=document.createElement(ri?'td':'th');inline(td,cell);tr.append(td);});t.append(tr);});n.append(t);}
    else if(k==='note'){n=document.createElement('div');n.className='note '+x;const b=document.createElement('b');b.textContent=NOTE[x];n.append(b);inline(n,y);}
    (anchorEl||a).append(n);
  }
  const qn=chQs(c.id).length;
  $('quizBtn').textContent=qn?('QUIZ ME ON THIS ('+qn+') →'):'BACK TO CHAPTERS';
}
function openChapter(id,topic){
  const c=CHBY[id];if(!c)return;
  openCh=id;S.last=id;save();
  el.chHome.hidden=true;el.chRead.hidden=false;
  el.rTitle.textContent=SECNAME[c.sec].split(' — ')[0];
  renderChapter(c);
  show('study');
  requestAnimationFrame(()=>{
    let y=S.pos[id]||0;
    if(topic){const t=el.reader.querySelector('.anchor[data-topic="'+CSS.escape(topic)+'"]');
      if(t){y=t.offsetTop-8;t.classList.remove('flash');void t.offsetWidth;t.classList.add('flash');}}
    el.rPane.scrollTop=y;
  });
}
function closeChapter(){openCh=null;el.chRead.hidden=true;el.chHome.hidden=false;renderHome();}
$('backBtn').onclick=closeChapter;
let posTimer;
el.rPane.addEventListener('scroll',()=>{
  if(!openCh)return;
  clearTimeout(posTimer);
  posTimer=setTimeout(()=>{
    const p=el.rPane;S.pos[openCh]=p.scrollTop;
    if(p.scrollTop+p.clientHeight>=p.scrollHeight-40)S.read[openCh]=true;   // reached the end = read
    save();
  },150);
},{passive:true});
$('quizBtn').onclick=()=>{
  if(!openCh)return;
  S.read[openCh]=true;save();
  if(!chQs(openCh).length){closeChapter();return;}
  setFilter('ch:'+openCh);show('drill');
};

// ════════ Drill ════════
function weight(i){
  const t=stat(i);let w;
  if(!seen(t))w=3; else if(t.s<0)w=4+Math.min(-t.s,3); else if(t.s>=3)w=.3; else if(t.s>=1)w=1; else w=2;
  if(t.f)w*=1.3;
  if(filter==='all'||filter==='weak'||filter==='traps')w*=EXAM[Q[i].s]/(secCount[Q[i].s]/Q.length);
  return w;
}
function pool(){
  if(filter==='learn'){const p=[];for(let i=0;i<Q.length&&p.length<BATCH;i++)if(!mastered(stat(i)))p.push(i);return p;}
  if(filter.startsWith('ch:'))return chQs(filter.slice(3));
  const p=[];
  for(let i=0;i<Q.length;i++){
    const t=stat(i),q=Q[i];
    if(filter==='weak'&&!isWeak(t))continue;
    if(filter==='traps'&&!q.nt)continue;
    if(/^s\d$/.test(filter)&&q.s!==+filter[1])continue;
    p.push(i);
  }
  return p;
}
function pick(){
  const p=pool();if(!p.length)return -1;
  if(filter==='learn'){const u=p.find(i=>!stat(i).t&&!seen(stat(i)));if(u!==undefined)return u;}
  const avoid=Math.min(recent.length,p.length-1,filter==='learn'?2:6);
  const block=new Set(recent.slice(recent.length-avoid));
  const pp=p.filter(i=>!block.has(i));
  const ws=pp.map(weight);let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let j=0;j<pp.length;j++){r-=ws[j];if(r<=0)return pp[j];}
  return pp[pp.length-1];
}
function shuffled(n,keep){const a=[...Array(n).keys()];if(keep)return a;for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderQ(text){
  const frag=document.createDocumentFragment();
  text.split(/\b(NOT|EXCEPT|FALSE|LESSER|BOTH|AFTER|BEFORE|ONLY|ALL)\b/).forEach((part,i)=>{
    if(i%2){const m=document.createElement('mark');m.textContent=part;frag.append(m);}else frag.append(part);
  });
  el.qText.replaceChildren(frag);
}
function setExp(q){
  const parts=[];
  const add=(cls,label,text)=>{if(!text)return;const d=document.createElement('div');d.className='xrow '+cls;
    if(label){const b=document.createElement('b');b.textContent=label;d.append(b,' ');}d.append(text);parts.push(d);};
  add('rule','',q.w);add('why','Now why is that important?',q.i);add('conf',"Don't confuse:",q.k);
  const c=document.createElement('div');c.className='cite'+(q.v===0?' unv':'');
  c.textContent=q.x+(q.v===0?' · not yet confirmed against statute text':'');parts.push(c);
  const chId=T2CH[q.t];
  if(chId){const b=document.createElement('button');b.className='readlink';b.textContent='📖 Read this in Study: '+CHBY[chId].title+' →';
    b.onclick=()=>openChapter(chId,q.t);parts.push(b);}
  el.exp.replaceChildren(...parts);
}
function next(){
  clearTimeout(lockTimer);
  cur=pick();answered=false;teaching=false;
  el.opts.classList.remove('locked');
  el.exp.className='exp pending';el.nextBtn.disabled=true;el.nextBtn.textContent='NEXT →';
  if(cur<0){
    el.qText.textContent=filter==='learn'?'Every card is mastered. Switch to Exam Mix for review.':'Nothing here yet. Try another filter.';
    el.opts.replaceChildren();el.exp.replaceChildren();el.qCat.textContent='';el.qSeen.textContent='';return;
  }
  recent.push(cur);if(recent.length>8)recent.shift();
  const q=Q[cur],t=stat(cur);
  teaching=filter==='learn'&&!t.t&&!seen(t);
  el.qCat.textContent=(teaching?'LEARN · ':'')+SECSHORT[q.s]+' · '+q.t;
  el.qSeen.textContent=teaching?'NEW FACT':(seen(t)?('seen '+seen(t)+'× · '+(t.w?t.w+' missed':'clean')):'NEW');
  renderQ(q.q);
  const frag=document.createDocumentFragment();
  shuffled(q.o.length,q.fix).forEach((orig,pos)=>{
    const b=document.createElement('button');b.className='opt';b.dataset.j=orig;
    const l=document.createElement('span');l.className='ltr';l.textContent=String.fromCharCode(65+pos)+'.';
    const s=document.createElement('span');s.textContent=q.o[orig];b.append(l,s);frag.append(b);
  });
  el.opts.replaceChildren(frag);
  setExp(q);el.exp.dataset.verdict=RUSH_TXT;   // reserve room for the longest state so nothing jumps
  fit();el.card.scrollTop=0;
  if(teaching){
    for(const b of el.opts.children)b.classList.add(+b.dataset.j===q.a?'right':'faded');
    el.exp.className='exp teach';el.exp.dataset.verdict='';
    el.nextBtn.disabled=false;el.nextBtn.textContent='GOT IT → QUIZ ME LATER';return;
  }
  el.opts.classList.add('locked');
  lockTimer=setTimeout(()=>{el.opts.classList.remove('locked');unlockAt=performance.now();},LOCK_MS);
}
function answer(j){
  if(answered||teaching||cur<0||el.opts.classList.contains('locked'))return;answered=true;
  const q=Q[cur],t={...stat(cur)},right=j===q.a,rushed=!right&&(performance.now()-unlockAt)<RUSH_MS;
  for(const b of el.opts.children){const k=+b.dataset.j;b.classList.add(k===q.a?'right':k===j?'wrong':'faded');}
  if(right){t.c++;t.s=t.s>0?t.s+1:1;S.streak++;S.today.c++;}
  else{t.w++;t.s=t.s<0?t.s-1:-1;S.streak=0;if(rushed)t.f=(t.f||0)+1;}
  S.q[q.id]=t;S.today.n++;
  el.exp.className='exp '+(right?'ok':'bad');el.exp.dataset.verdict=rushed?RUSH_TXT:'';
  el.nextBtn.disabled=false;
  el.card.scrollTo({top:el.card.scrollHeight,behavior:'smooth'});
  save();renderStats();
}
el.opts.addEventListener('click',e=>{const b=e.target.closest('.opt');if(b)answer(+b.dataset.j);});
el.nextBtn.addEventListener('click',()=>{
  if(teaching&&cur>=0){const q=Q[cur],t={...stat(cur)};t.t=1;S.q[q.id]=t;save();}
  next();
});
function setFilter(f){
  filter=f;recent=[];
  if(f.startsWith('ch:')){const c=CHBY[f.slice(3)];el.chChip.hidden=false;el.chChip.dataset.f=f;el.chChip.textContent='📖 '+c.title;}
  for(const x of $('filters').children)if(x.dataset.f!==undefined)x.classList.toggle('on',x.dataset.f===f);
  $('filters').scrollLeft=0;
  next();
}
$('filters').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c||!c.dataset.f)return;setFilter(c.dataset.f);});

function renderStats(){
  el.today.textContent=S.today.n;
  el.acc.textContent=S.today.n?Math.round(100*S.today.c/S.today.n)+'%':'—';
  el.streak.textContent=S.streak>1?'🔥 '+S.streak:'';
  let weak=0,rush=0;
  for(let i=0;i<Q.length;i++){const t=stat(i);if(isWeak(t))weak++;if(t.f&&t.s<2)rush++;}
  el.weak.textContent=weak;el.rush.textContent=rush;
  if(!openCh)renderHome();
}
let armTimer;
el.reset.addEventListener('click',()=>{
  if(!el.reset.classList.contains('armed')){
    el.reset.classList.add('armed');el.reset.textContent='Tap again to wipe';
    clearTimeout(armTimer);armTimer=setTimeout(()=>{el.reset.classList.remove('armed');el.reset.textContent='Reset Progress';},3000);return;
  }
  clearTimeout(armTimer);el.reset.classList.remove('armed');el.reset.textContent='Progress wiped';
  setTimeout(()=>{el.reset.textContent='Reset Progress';},1800);
  S={...fresh(),view:'drill'};recent=[];save();next();renderStats();
});

// ════════ Game-style scaling ════════
const DESIGN_W=420,MIN_H=780;
let U=1;
function setScale(){
  const f=$('frame'),w=f.clientWidth,h=f.clientHeight;
  U=Math.max(.45,Math.min(w/DESIGN_W,h/MIN_H));
  document.documentElement.style.setProperty('--u',U+'px');
  if(window.scrollY)window.scrollTo(0,0);
}
function fit(){
  if(cur<0||el.vDrill.hidden)return;
  const card=el.card,root=document.documentElement.style;
  for(let q=30;q>=13;q-=.5){
    root.setProperty('--qs',(q*U)+'px');
    root.setProperty('--os',(Math.max(13,q*.8)*U)+'px');
    root.setProperty('--es',(Math.max(12.5,q*.64)*U)+'px');
    if(card.scrollHeight<=card.clientHeight)break;
  }
}
function relayout(){setScale();fit();}
let rq;const onResize=()=>{cancelAnimationFrame(rq);rq=requestAnimationFrame(relayout);};
addEventListener('resize',onResize);
addEventListener('orientationchange',onResize);
if(window.visualViewport)visualViewport.addEventListener('resize',onResize);
addEventListener('scroll',()=>{if(window.scrollY)window.scrollTo(0,0);},{passive:true});
setScale();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);

load();
</script>
